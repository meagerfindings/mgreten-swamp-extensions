# Import sources for tools/import-package.ts. Each entry pins a source commit
# and the exact paths that make up the package. The importer filters that
# history in a temporary clone, rewrites `from` to packages/<short>/<to>, and
# never touches the source checkout. Package layout inside packages/<short>/
# preserves the source's layout relative to its extensions root, so manifests
# resolve unchanged with `--extensions-dir packages/<short>`.
schemaVersion: 1
packages:
