    short: granola-mcp
    source: git@github.com:meagerfindings/swamp-granola-mcp.git
    ref: 5bc94d2dc63b1dbc6daaec5b32b1d65c98f9519a
    manifest: extensions/models/manifest.yaml
    paths:
