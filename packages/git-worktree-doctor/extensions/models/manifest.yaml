manifestVersion: 1
name: "@mgreten/git-worktree-doctor"
version: "2026.05.19.1"
description: >
  Diagnose and prune git worktrees. Parses `git worktree list --porcelain`,
  validates paths exist on disk, detects stale/locked/prunable entries,
  and optionally prunes them. Works with any git repository — no
  project-specific assumptions.

repository: https://github.com/meagerfindings/swamp-git-worktree-doctor

models:
  - git_worktree_doctor.ts

additionalFiles:
  - README.md
  - LICENSE.txt

platforms: []
