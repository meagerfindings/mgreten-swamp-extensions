manifestVersion: 1
name: "@mgreten/unifi-release-safety"
version: "2026.11.06.1"
description: >
  Read-only UniFi firmware release observation through an optional Home
  Assistant collector or caller-supplied model/version observations.
  Deduplicates transitions and schedules initial plus 7/14/21-day evidence
  reviews without installing updates.
repository: "https://github.com/meagerfindings/mgreten-swamp-extensions"
license: MIT

paths:
  base: manifest

additionalFiles:
  - README.md
  - LICENSE.md

models:
  - model.ts

platforms:
  - linux-x86_64
  - darwin-aarch64
