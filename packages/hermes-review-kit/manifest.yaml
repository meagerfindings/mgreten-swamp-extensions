manifestVersion: 1
name: "@mgreten/hermes-review-kit"
version: "2026.10.14.1"
description: "Hermes review automation kit with a local-first collector model, workflow-scope report, and nightly workflow for reviews and publishability screening."
license: MIT

repository: https://github.com/meagerfindings/hermes-review-kit

paths:
  base: manifest

models:
  - model.ts

reports:
  - review_report.ts

workflows:
  - workflows/hermes-daily-review.yaml

additionalFiles:
  - README.md
  - LICENSE.md

platforms:
  - linux-x86_64
  - darwin-aarch64
