manifestVersion: 1
name: "@mgreten/road-trip-risk-watch"
version: "2026.11.26.1"
description: >
  Native route-risk watcher that polls official NWS forecast and alert data for
  checkpointed trips, computes a stable fingerprint, and emits digest output
  only when conditions change materially. Scheduling is the caller's
  responsibility and must respect provider policies and limits. If a companion
  origin snapshot file is present at liveOriginStatePath, it resolves the first
  checkpoint from that live geocoded location on each run. The separate assess
  method compares caller-supplied route checkpoints and arrival times using NWS
  forecasts and manually supplied road observations; it does not navigate or
  collect automated road conditions.
repository: "https://github.com/meagerfindings/mgreten-swamp-extensions"
license: MIT

paths:
  base: manifest

additionalFiles:
  - README.md
  - LICENSE.md

models:
  - model.ts

include:
  - assessment.ts
  - progress.ts

platforms:
  - linux-x86_64
  - darwin-aarch64
