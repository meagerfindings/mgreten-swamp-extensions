manifestVersion: 1
name: "@mgreten/brief-sanitize"
version: "2026.07.20.1"
description: >
  Deterministic, dependency-free sanitizer for untrusted text (email bodies,
  calendar invites, scraped pages, third-party payloads) before it is fed to
  an LLM prompt. Strips HTML/entities/obfuscation characters, defangs URLs,
  truncates, and wraps each item in escaped delimiters so a downstream prompt
  can safely quote it as data rather than instructions. Defense-in-depth
  against prompt injection: no LLM, no network, no secrets.

repository: https://github.com/meagerfindings/swamp-brief-sanitize

models:
  - brief_sanitize.ts

additionalFiles:
  - README.md
  - LICENSE.txt

platforms: []
